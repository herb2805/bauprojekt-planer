<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A1224">
  <meta name="description" content="Holzlisten, Zuschnitt, Materialmengen (Beton, Putz, Mauerwerk, Fliesen, Trockenbau u. v. m.) und Bestellungen für Bauprojekte">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Bauprojekt-Planer">
  <title>Blaupause – Bauprojekt-Planer</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="top">
    <div class="top__title">
      <p class="eyebrow" id="current-project">Blaupause</p>
      <h1 id="page-title">Projekte</h1>
    </div>
    <div id="top-action"></div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Bereiche">
    <button data-tab="projekte" class="tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg><span>Projekte</span></button>
    <button data-tab="liste" class="tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg><span>Holzliste</span></button>
    <button data-tab="lager" class="tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18M3 12h18M3 17h12"/><path d="M7 5v4M17 10v4M11 15v4"/></svg><span>Lager</span></button>
    <button data-tab="zuschnitt" class="tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/><path d="M14 4v4M9 10v4M16 16v4"/></svg><span>Zuschnitt</span></button>
    <button data-tab="material" class="tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l-1.5 12h-9z"/><path d="M8 8c0-2.5 1.8-4 4-4s4 1.5 4 4"/><path d="M8.5 13h7"/></svg><span>Material</span></button>
    <button data-tab="bestellung" class="tab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.5 11h11L21 7H6.2"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/></svg><span>Bestellung</span></button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/optimizer.js"></script>
  <script src="js/calcs.js"></script>
  <script src="js/material.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
